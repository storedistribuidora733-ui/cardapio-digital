<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin — Alison Burger</title>
    <style>
        * { font-family: 'Poppins', sans-serif; box-sizing: border-box; }
        body { background:#f5f5f5; padding:15px; max-width:600px; margin:0 auto; }
        .painel { background:#fff; padding:20px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.1); }
        .grupo { margin:10px 0; }
        label { display:block; margin-bottom:4px; font-weight:600; font-size:.9rem; }
        input, select, textarea { width:100%; padding:8px; border:1px solid #ddd; border-radius:6px; }
        button { padding:10px 18px; border:none; border-radius:6px; font-weight:600; cursor:pointer; margin:5px 2px; font-size:1rem; }
        .btn-salvar { background:#22c55e; color:white; }
        .btn-remover { background:#dc2626; color:white; }
        .aviso { padding:10px; border-radius:6px; margin:8px 0; display:none; border-radius:6px; }
        .sucesso { background:#dcfce7; color:#166534; }
        .erro { background:#fee2e2; color:#991b1b; }
        .item-produto { border:1px solid #eee; padding:12px; border-radius:6px; margin:8px 0; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="painel">
        <h2>🔐 Painel Administrativo — Automático</h2>

        <div id="tela-login">
            <div class="grupo">
                <label>Senha Administrador</label>
                <input type="password" id="senha-admin" placeholder="Digite sua senha...">
            </div>
            <button onclick="verificarSenha()">Acessar Painel</button>
            <p id="msg-login" class="aviso"></p>
        </div>

        <div id="conteudo-admin" style="display:none;">
            <div id="aviso-salvar" class="aviso"></div>

            <h3>⚙️ Configurações Gerais</h3>
            <div class="grupo">
                <label>Nome da Loja</label>
                <input type="text" id="cfg-nome">
            </div>
            <div class="grupo">
                <label>Taxa de Entrega (R$)</label>
                <input type="number" step="0.01" id="cfg-taxa">
            </div>
            <div class="grupo">
                <label>WhatsApp (apenas números)</label>
                <input type="text" id="cfg-whats">
            </div>
            <div class="grupo">
                <label>Horário Abertura</label>
                <input type="number" id="cfg-hora-abre" min="0" max="23">
            </div>
            <div class="grupo">
                <label>Horário Fechamento</label>
                <input type="number" id="cfg-hora-fecha" min="0" max="23">
            </div>
            <button class="btn-salvar" onclick="salvarTudo()">💾 SALVAR — Atualiza para TODOS IMEDIATAMENTE</button>

            <hr style="margin:22px 0;">

            <h3>➕ Adicionar Produto Novo</h3>
            <div class="grupo">
                <label>Categoria</label>
                <select id="prod-cat">
                    <option value="hamburgueres">Hambúrgueres</option>
                    <option value="combos">Combos</option>
                    <option value="bebidas">Bebidas</option>
                    <option value="acompanhamentos">Acompanhamentos</option>
                </select>
            </div>
            <div class="grupo">
                <label>Nome do Produto</label>
                <input type="text" id="prod-nome">
            </div>
            <div class="grupo">
                <label>Preço (R$)</label>
                <input type="number" step="0.01" id="prod-preco">
            </div>
            <div class="grupo">
                <label>Descrição Curta</label>
                <textarea id="prod-desc" rows="2"></textarea>
            </div>
            <div class="grupo">
                <label>Link da Imagem</label>
                <input type="text" id="prod-img" placeholder="https://...jpg">
            </div>
            <button onclick="adicionarProduto()">Adicionar à Lista</button>

            <hr style="margin:22px 0;">

            <h3>📋 Lista de Produtos</h3>
            <div id="lista-produtos-admin"></div>
        </div>
    </div>

<script src="admin.js"></script>
</body>
</html>
