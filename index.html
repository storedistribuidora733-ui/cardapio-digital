<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alison Burger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        html { font-size: 14px; }
        body { background-color: #f8f9fa; padding-bottom: 60px; line-height: 1.4; overflow-x: hidden; }
        @media (min-width: 768px) {
            html { font-size: 15px; }
            body { max-width: 620px; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
            .carrinho-fixo { max-width: 620px; left: 50%; transform: translateX(-50%); padding: 7px 15px; border-radius: 12px 12px 0 0; }
            .badge-qtd { width: 28px; height: 28px; font-size: 0.85rem; }
            .texto-carrinho h3 { font-size: 1rem; }
            .texto-carrinho p { font-size: 0.8rem; }
            .btn-ver-carrinho { padding: 8px 15px; font-size: 0.85rem; border-radius: 8px; }
            #modal-produto, #modal-carrinho { max-width: 580px; left: 50%; transform: translateX(-50%); }
        }
        .status-topo { display: flex; align-items: center; gap: 10px; padding: 14px 18px; background: #fff; border-bottom: 1px solid #eee; }
        .nome-loja-cabecalho { font-size: 1.5rem; font-weight: 800; color: #111; white-space: nowrap; }
        .ponto-status { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; margin-top: 1px; }
        .ponto-status.aberto { background: #22c55e; }
        .ponto-status.fechado { background: #dc2626; }
        .texto-status { font-size: 1rem; color: #333; white-space: nowrap; }
        .categorias { width: 100%; padding: 7px 10px; display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; background: #F5F7FA; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 99; }
        .categorias::-webkit-scrollbar { display: none; }
        .categoria-btn { padding: 6px 10px; border-radius: 6px; border: 1px solid #e5e7eb; background: #fff; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap; transition: .2s; }
        .categoria-btn.ativo { background: #dc2626; border-color: #dc2626; color: #fff; }
        .busca { margin: 8px 10px; position: relative; }
        .busca input { width: 100%; padding: 8px 10px 8px 30px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 0.85rem; background: #fff; }
        .busca input:focus { outline: none; border-color: #dc2626; box-shadow: 0 0 0 2px rgba(220,38,38,.15); }
        .busca i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #9ca3af; font-size: 0.9rem; }
        .container { width: 100%; padding: 0 10px; }
        .lista-produtos { display: flex; flex-direction: column; gap: 7px; margin: 8px 0; }
        .produto { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 9px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: .2s; }
        .produto:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,.1); }
        .produto.oculto { display: none; }
        .produto-imagem { width: 70px; height: 70px; border-radius: 6px; overflow: hidden; flex-shrink: 0; background: #f3f4f6; }
        .produto-imagem img { width: 100%; height: 100%; object-fit: cover; }
        .tag-mais-pedido { position: absolute; top: 0; left: 0; background: #dc2626; color: #fff; font-size: .65rem; font-weight: 600; padding: 2px 4px; border-radius: 0 0 5px 0; }
        .produto-info { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .produto-codigo { font-size: .75rem; font-weight: 700; color: #dc2626; }
        .produto-nome { font-size: 1.1rem; font-weight: 700; color: #111; }
        .produto-descricao { font-size: .8rem; color: #6b7280; line-height: 1.3; }
        .produto-detalhes { font-size: .7rem; color: #78716c; display: flex; gap: 8px; margin-top: 3px; }
        .produto-preco { font-size: 1.2rem; font-weight: 800; color: #dc2626; white-space: nowrap; margin-left: auto; }
        .carrinho-fixo { position: fixed; bottom: 0; left: 0; width: 100%; background: #111827; color: #fff; padding: 6px 10px; box-shadow: 0 -2px 8px rgba(0,0,0,.15); z-index: 999; display: none; border-top-left-radius: 10px; border-top-right-radius: 10px; }
        .carrinho-conteudo { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .carrinho-esq { display: flex; align-items: center; gap: 7px; flex: 1; }
        .badge-qtd { width: 26px; height: 26px; background: #dc2626; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .8rem; flex-shrink: 0; }
        .texto-carrinho h3 { font-size: .95rem; margin: 0; font-weight: 600; white-space: nowrap; }
        .texto-carrinho p { font-size: .75rem; color: #b0b3b8; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-ver-carrinho { background: #dc2626; color: #fff; border: none; border-radius: 6px; padding: 7px 12px; font-size: .8rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .oculto { display: none !important; }
        #modal-produto { position: fixed; inset: 0; background: #fff; z-index: 9999; overflow-y: auto; }
        .cabecalho-detalhe { position: relative; width: 100%; height: 180px; background: #f3f4f6; }
        #btn-voltar { position: absolute; top: 10px; left: 10px; width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,.9); color: #222; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
        #img-detalhe { width: 100%; height: 100%; object-fit: cover; background: #f3f4f6; }
        .faixa-status { position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); background: #fff; padding: 6px 18px; border-radius: 50%; border: 2px solid #dc2626; font-size: 1rem; font-weight: 600; color: #dc2626; box-shadow: 0 2px 8px rgba(0,0,0,.05); display: flex; align-items: center; gap: 6px; }
        .conteudo-detalhe { padding: 25px 15px 110px; }
        #nome-detalhe { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; color: #111; }
        #descricao-detalhe { font-size: 1.1rem; color: #666; line-height: 1.5; margin-bottom: 15px; }
        .precos { display: flex; align-items: baseline; gap: 15px; margin-bottom: 25px; }
        .preco-promocional { font-size: 1.8rem; font-weight: 800; color: #dc2626; font-weight: 800; }
        .quero-btn { margin-left: auto; font-size: 1.4rem; color: #dc2626; font-weight: 600; cursor: pointer; }
        .rodape-detalhe { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; padding: 12px 15px; border-top: 1px solid #e5e7eb; display: flex; align-items: center; gap: 15px; }
        .qtd-detalhe { display: flex; align-items: center; gap: 20px; }
        .qtd-detalhe button { font-size: 1.8rem; border: none; background: none; cursor: pointer; color: #dc2626; font-weight: 700; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
        #qtd-atual { font-size: 1.4rem; min-width: 24px; text-align: center; }
        #btn-adicionar-detalhe { flex: 1; padding: 10px 15px; border: none; border-radius: 10px; background: #dc2626; color: #fff; font-size: 1rem; font-weight: 500; cursor: pointer; }
        #modal-carrinho { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 10px; }
        .modal-conteudo { background: #fff; width: 100%; max-width: 500px; max-height: 90vh; border-radius: 10px; padding: 12px; overflow-y: auto; }
        .modal-cabecalho { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
        .fechar-modal { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #666; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .item-carrinho { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid #eee; font-size: .9rem; }
        .form-grupo { margin: 8px 0; }
        .form-grupo label { display: block; margin-bottom: 3px; font-weight: 500; font-size: .85rem; }
        .form-grupo input, .form-grupo select, .form-grupo textarea { width: 100%; padding: 7px; border: 1px solid #ddd; border-radius: 5px; font-size: .85rem; }
        .form-duplo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .aviso-erro { font-size: .8rem; color: #dc2626; margin-top: 2px; }
        .total-texto { font-size: 1rem; font-weight: 700; text-align: right; margin: 8px 0; }
        .botoes-modal { display: flex; gap: 7px; margin-top: 10px; }
        .btn-fechar { flex: 1; padding: 8px; border: none; border-radius: 5px; background: #eee; font-size: .85rem; cursor: pointer; }
        .btn-finalizar { flex: 2; padding: 8px; border: none; border-radius: 5px; background: #22c55e; color: #fff; font-size: .85rem; cursor: pointer; }
        #alerta-fechado { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 1001; padding: 10px; }
        .alerta-caixa { background: #fff; padding: 15px; border-radius: 8px; text-align: center; max-width: 280px; }
        .alerta-caixa h2 { color: #dc2626; margin-bottom: 7px; font-size: 1.2rem; }
        .btn-entendi { margin-top: 10px; padding: 7px 14px; border: none; border-radius: 5px; background: #dc2626; color: #fff; font-size: .85rem; cursor: pointer; }
        html,body { overflow-x: hidden; touch-action: manipulation; }
    </style>
</head>
<body>
<div class="status-topo">
    <h1 class="nome-loja-cabecalho">ALISON BURGER</h1>
    <span class="ponto-status" id="ponto-status"></span>
    <span id="texto-status" class="texto-status"></span>
</div>
<div class="categorias">
    <button class="categoria-btn ativo" data-categoria="todos"><i class="fa fa-th-large"></i> Todos</button>
    <button class="categoria-btn" data-categoria="hamburgueres"><i class="fa fa-burger"></i> Hambúrgueres</button>
    <button class="categoria-btn" data-categoria="combos"><i class="fa fa-star"></i> Combos</button>
    <button class="categoria-btn" data-categoria="bebidas"><i class="fa fa-glass-water"></i> Bebidas</button>
    <button class="categoria-btn" data-categoria="acompanhamentos"><i class="fa fa-french-fries"></i> Acompanhamentos</button>
</div>
<div class="busca">
    <i class="fa fa-search"></i>
    <input type="text" id="campoBusca" placeholder="Buscar produtos...">
</div>
<div class="container">
    <div class="lista-produtos" id="lista-produtos"></div>
</div>
<div id="modal-produto" class="oculto">
    <div class="cabecalho-detalhe">
        <button id="btn-voltar">&larr;</button>
        <img id="img-detalhe" alt="">
        <div class="faixa-status">
            <span class="ponto-status" id="ponto-status-modal"></span>
            <span id="texto-status-modal"></span>
        </div>
    </div>
    <div class="conteudo-detalhe">
        <h2 id="nome-detalhe"></h2>
        <p id="descricao-detalhe"></p>
        <div class="precos">
            <span class="preco-promocional" id="preco-promocional"></span>
            <span class="quero-btn">Quero &gt;</span>
        </div>
    </div>
    <div class="rodape-detalhe">
        <div class="qtd-detalhe">
            <button id="diminuir-qtd">&minus;</button>
            <span id="qtd-atual">1</span>
            <button id="aumentar-qtd">+</button>
        </div>
        <button id="btn-adicionar-detalhe">Adicionar</button>
    </div>
</div>
<div id="modal-carrinho" class="oculto">
    <div class="modal-conteudo">
        <div class="modal-cabecalho">
            <h3>Meu Carrinho</h3>
            <button id="fechar-modal" class="fechar-modal">&times;</button>
        </div>
        <div id="lista-itens-carrinho"></div>
        <p class="total-texto">Total: R$ <span id="valor-total">0,00</span></p>
        <div class="form-grupo">
            <label>Forma de recebimento</label>
            <select id="tipo-atendimento">
                <option value="retirada">Retirada</option>
                <option value="entrega">Entrega</option>
            </select>
        </div>
        <div id="campo-taxa-entrega" class="form-grupo oculto">
            <label>Taxa de entrega</label>
            <input type="text" id="taxa-entrega" value="8,00" readonly style="background: #f8f8f8;">
        </div>
        <div class="form-grupo">
            <label>Nome completo</label>
            <input type="text" id="nome-cliente" placeholder="Digite seu nome">
        </div>
        <div id="bloco-endereco" class="oculto">
            <div class="form-grupo">
                <label>CEP</label>
                <input type="text" id="cep" placeholder="Ex: 00000-000" maxlength="9">
                <p id="aviso-cep" class="aviso-info">Digite o CEP para preencher automaticamente</p>
            </div>
            <div class="form-duplo">
                <div class="form-grupo">
                    <label>Número</label>
                    <input type="text" id="numero" placeholder="Ex: 123">
                </div>
                <div class="form-grupo">
                    <label>Complemento</label>
                    <input type="text" id="complemento" placeholder="Ex: Apto 1">
                </div>
            </div>
            <div class="form-grupo">
                <label>Referência</label>
                <input type="text" id="referencia" placeholder="Ex: Próximo ao mercado">
            </div>
            <div class="form-grupo">
                <label>Rua / Logradouro</label>
                <input type="text" id="rua" placeholder="Preenchido automaticamente">
            </div>
            <div class="form-duplo">
                <div class="form-grupo">
                    <label>Bairro</label>
                    <input type="text" id="bairro" placeholder="Preenchido automaticamente">
                </div>
                <div class="form-grupo">
                    <label>Cidade / UF</label>
                    <input type="text" id="cidade-uf" placeholder="Preenchido automaticamente">
                </div>
            </div>
        </div>
        <div class="form-grupo">
            <label>Forma de pagamento</label>
            <select id="forma-pagamento">
                <option value="Dinheiro">Dinheiro</option>
                <option value="Pix">Pix</option>
                <option value="Cartão">Cartão</option>
            </select>
        </div>
        <div class="form-grupo">
            <label>Observações</label>
            <textarea id="observacao" placeholder="Alguma observação ou pedido especial?"></textarea>
        </div>
        <p id="aviso-geral" class="aviso-erro oculto"></p>
        <div class="botoes-modal">
            <button id="btn-limpar" class="btn-fechar">Limpar Carrinho</button>
            <button id="btn-finalizar" class="btn-finalizar">Finalizar Pedido</button>
        </div>
    </div>
</div>
<div id="alerta-fechado" class="oculto">
    <div class="alerta-caixa">
        <h2>Loja Fechada</h2>
        <p>Atendimento das 07:00 às 23:00</p>
        <button id="btn-entendi" class="btn-entendi">Entendi</button>
    </div>
</div>
<div class="carrinho-fixo" id="carrinho-container">
    <div class="carrinho-conteudo">
        <div class="carrinho-esq">
            <span class="badge-qtd" id="qtd-carrinho">0</span>
            <div class="texto-carrinho">
                <h3>Meu carrinho</h3>
                <p id="resumo-carrinho">0 itens • R$ 0,00</p>
            </div>
        </div>
        <button class="btn-ver-carrinho" id="abrir-carrinho"> Ver </button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
