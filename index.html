<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cardápio Digital | Pedido na Mesa</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Tela de Entrada -->
    <div class="screen active" id="screenEntry">
        <div class="entry-container">
            <div class="brand">
                <div class="logo-icon"><i class="fas fa-utensils"></i></div>
                <h1>SABOR & ARTE</h1>
                <p>Faça seu pedido direto pelo celular</p>
            </div>
            <div class="entry-card">
                <label for="tableNumber">Número da Mesa</label>
                <input type="number" id="tableNumber" placeholder="Ex: 12" min="1" autocomplete="off">
                <button class="btn primary-btn" id="startBtn">
                    <i class="fas fa-arrow-right"></i> Iniciar Pedido
                </button>
            </div>
        </div>
    </div>

    <!-- Tela do Cardápio -->
    <div class="screen" id="screenMenu">
        <header class="menu-header">
            <div class="header-left">
                <span class="table-badge">Mesa <strong id="currentTable">--</strong></span>
            </div>
            <div class="header-right">
                <button class="cart-icon-btn" id="cartBtn">
                    <i class="fas fa-shopping-basket"></i>
                    <span class="cart-badge" id="cartBadge">0</span>
                </button>
            </div>
        </header>

        <!-- Categorias Roláveis -->
        <nav class="categories-nav">
            <div class="categories-wrapper">
                <button class="cat-tab active" data-cat="all">
                    <i class="fas fa-th-large"></i> Todos
                </button>
                <button class="cat-tab" data-cat="pizzas">
                    <i class="fas fa-pizza-slice"></i> Pizzas
                </button>
                <button class="cat-tab" data-cat="meals">
                    <i class="fas fa-utensils"></i> Pratos
                </button>
                <button class="cat-tab" data-cat="drinks">
                    <i class="fas fa-glass-water"></i> Bebidas
                </button>
                <button class="cat-tab" data-cat="desserts">
                    <i class="fas fa-cake-candles"></i> Sobremesas
                </button>
            </div>
        </nav>

        <!-- Lista de Produtos -->
        <main class="products-container">
            <div class="products-grid" id="productsGrid"></div>
        </main>
    </div>

    <!-- Tela do Carrinho -->
    <div class="screen" id="screenCart">
        <header class="menu-header">
            <button class="back-btn" id="backToMenu">
                <i class="fas fa-chevron-left"></i>
            </button>
            <h2>Meu Pedido</h2>
            <div style="width:40px;"></div>
        </header>
        <div class="cart-content">
            <div class="empty-cart" id="emptyCart">
                <i class="fas fa-shopping-basket"></i>
                <p>Nenhum item adicionado</p>
                <button class="btn primary-btn" id="goToMenuBtn">Ver Cardápio</button>
            </div>
            <div class="cart-items-list" id="cartItemsList"></div>
        </div>
        <div class="cart-footer" id="cartFooter" style="display:none;">
            <div class="subtotal-row">
                <span>Subtotal</span>
                <strong id="subtotalValue">R$ 0,00</strong>
            </div>
            <button class="btn confirm-btn" id="submitOrderBtn">
                <i class="fas fa-check-circle"></i> Confirmar Pedido
            </button>
        </div>
    </div>

    <!-- Tela de Confirmação -->
    <div class="screen" id="screenSuccess">
        <div class="success-container">
            <div class="success-animation">
                <i class="fas fa-check"></i>
            </div>
            <h2>Pedido Enviado! 🎉</h2>
            <p>Seu pedido da <strong>Mesa <span id="confirmedTable">--</span></strong> foi enviado para a cozinha.</p>
            <p class="wait-note">Em breve chegará até você</p>
            <button class="btn primary-btn" id="newOrderBtn">
                <i class="fas fa-plus"></i> Fazer Outro Pedido
            </button>
        </div>
    </div>

    <!-- Modal de Produto -->
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="product-modal" id="productModal">
        <button class="modal-close-btn" id="modalCloseBtn">
            <i class="fas fa-times"></i>
        </button>
        <div class="modal-body">
            <img class="product-modal-img" id="modalImg" src="" alt="">
            <div class="product-modal-info">
                <h2 id="modalName"></h2>
                <p class="modal-desc" id="modalDesc"></p>
                <p class="modal-price" id="modalPrice"></p>

                <!-- Opções -->
                <div class="options-section" id="optionsSection"></div>

                <!-- Observação -->
                <div class="note-section">
                    <label>Observações</label>
                    <textarea id="noteInput" placeholder="Ex: sem cebola, bem quente..."></textarea>
                </div>

                <!-- Quantidade -->
                <div class="qty-section">
                    <span>Quantidade</span>
                    <div class="qty-control">
                        <button class="qty-minus" id="qtyMinus"><i class="fas fa-minus"></i></button>
                        <span id="qtyValue">1</span>
                        <button class="qty-plus" id="qtyPlus"><i class="fas fa-plus"></i></button>
                    </div>
                </div>

                <button class="btn add-cart-btn" id="addToCartBtn">
                    <i class="fas fa-cart-plus"></i> Adicionar — <span id="addTotal">R$ 0,00</span>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
