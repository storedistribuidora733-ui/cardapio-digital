<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cardápio Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f8f8f8; padding-bottom: 85px; }

        /* Tela de carregamento */
        .carregando {
            position: fixed; inset: 0; background: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; color: #444; z-index: 999;
        }

        /* Aviso loja inativa */
        .inativa {
            max-width: 400px; margin: 40px auto; padding: 30px;
            background: #fff; border: 2px solid #dc2626; border-radius: 10px;
            text-align: center; color: #333;
        }

        /* Cabeçalho */
        .cabecalho { background: #222; color: #fff; padding: 15px; text-align: center; }
        .cabecalho h1 { font-size: 1.2rem; margin-bottom: 4px; }
        .status { font-size: 0.9rem; }
        .aberto { color: #22c55e; }
        .fechado { color: #dc2626; }

        /* Barra de busca */
        .busca { padding: 12px; max-width: 500px; margin: 0 auto; }
        .busca input {
            width: 100%; padding: 10px 15px; border-radius: 25px;
            border: 1px solid #ddd; outline: none; font-size: 0.95rem;
        }

        /* Categorias */
        .categorias { display: flex; overflow-x: auto; gap: 10px; padding: 10px 15px; scrollbar-width: thin; }
        .categoria {
            background: #fff; border: 1px solid #ddd; padding: 7px 16px;
            border-radius: 20px; white-space: nowrap; font-size: 0.9rem; cursor: pointer;
            transition: 0.2s;
        }
        .categoria.ativa { background: #e63946; color: #fff; border-color: #e63946; }

        /* Produtos */
        .container { padding: 15px; max-width: 1000px; margin: 0 auto; }
        .produto {
            background: #fff; border: 1px solid #ddd; border-radius: 10px;
            padding: 12px; margin-bottom: 12px; display: flex; gap: 12px; align-items: center;
        }
        .produto img { width: 85px; height: 85px; object-fit: cover; border-radius: 8px; }
        .info { flex: 1; }
        .info h3 { font-size: 1rem; color: #222; margin-bottom: 3px; }
        .info p.desc { font-size: 0.85rem; color: #666; margin-bottom: 6px; }
        .preco { font-weight: bold; color: #e63946; font-size: 1rem; }

        /* Modal do produto */
        .modal {
            display: none; position: fixed; inset: 0; background: #00000070;
            align-items: center; justify-content: center; z-index: 200; padding: 15px;
        }
        .modal-content {
            background: #fff; border-radius: 12px; max-width: 420px; width: 100%;
            padding: 20px; max-height: 90vh; overflow-y: auto;
        }
        .qtd-box { display: flex; align-items: center; gap: 12px; margin: 15px 0; }
        .qtd-btn {
            width: 38px; height: 38px; border-radius: 50%; border: none;
            background: #e63946; color: #fff; font-size: 1.2rem; cursor: pointer;
        }
        .btn-adicionar {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            background: #22c55e; color: #fff; font-size: 1rem; font-weight: bold; cursor: pointer;
            margin-top: 8px;
        }
        .fechar {
            float: right; font-size: 1.4rem; color: #888; cursor: pointer; margin-top: -5px;
        }

        /* Botão WhatsApp */
        .whatsapp {
            position: fixed; bottom: 20px; right: 20px; background: #25d366;
            color: #fff; width: 55px; height: 55px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; text-decoration: none; box-shadow: 0 2px 10px #0003; z-index: 100;
        }

        /* Carrinho fixo */
        .carrinho-fixo {
            position: fixed; bottom: 20px; left: 20px; background: #e63946;
            color: #fff; padding: 10px 14px; border-radius: 8px; font-weight: bold; z-index: 100;
            font-size: 0.95rem; box-shadow: 0 2px 8px #0002;
        }
    </style>
</head>
<body>
    <div class="carregando" id="telaCarregando">Carregando cardápio...</div>

    <div id="conteudoPrincipal" style="display:none;">
        <div class="cabecalho">
            <h1 id="nomeLoja"></h1>
            <p id="statusLoja" class="status"></p>
        </div>

        <div class="busca">
            <input type="text" id="buscaProduto" placeholder="🔍 Buscar produto...">
        </div>

        <div class="categorias" id="listaCategorias"></div>
        <div class="container" id="listaProdutos"></div>

        <a href="" target="_blank" class="whatsapp" id="linkWhatsApp" title="Abrir WhatsApp">
            <i class="fab fa-whatsapp"></i>
        </a>
        <div class="carrinho-fixo">
            🛒 <span id="contadorCarrinho">0</span> itens | R$ <span id="valorCarrinho">0,00</span>
        </div>
    </div>

    <!-- Modal Produto -->
    <div class="modal" id="modalProduto">
        <div class="modal-content">
            <span class="fechar" onclick="fecharModal()">&times;</span>
            <h3 id="modalNome"></h3>
            <p id="modalDesc" style="color:#666; margin:8px 0;"></p>
            <p class="preco" id="modalPreco"></p>
            <div class="qtd-box">
                <button class="qtd-btn" onclick="alterarQtd(-1)">−</button>
                <span id="qtdAtual" style="font-size:1.1rem; font-weight:bold;">1</span>
                <button class="qtd-btn" onclick="alterarQtd(+1)">+</button>
            </div>
            <button class="btn-adicionar" onclick="adicionarAoCarrinho()">Adicionar ao Pedido</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
